name: Deploy to Cloudflare

# Phone-free 24x7: push to main (or press Run workflow) and GitHub builds,
# creates D1 + R2 if they are missing, and deploys the Worker. No device of
# yours has to be awake, and Termux never has to build anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run check

      - name: Create D1 + R2 and write the deploy config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare.mjs setup

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.jsonc
          secrets: |
            APP_PASSWORD
            SESSION_SECRET
            CRON_SECRET
            APP_ORIGIN
            OPENAI_API_KEY
            OPENAI_BASE_URL
            IMAGE_API_KEY
            IMAGE_BASE_URL
            GROQ_API_KEY
            OPENROUTER_API_KEY
            GEMINI_API_KEY
            CEREBRAS_API_KEY
            MISTRAL_API_KEY
            TOGETHER_API_KEY
            GITHUB_MODELS_TOKEN
            OLLAMA_BASE_URL
            OLLAMA_MODEL
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}

      - name: Health check
        env:
          BASE_URL: ${{ secrets.AUTOREEL_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "AUTOREEL_BASE_URL not set - skipping the health check"
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 4 "$BASE_URL/health"
